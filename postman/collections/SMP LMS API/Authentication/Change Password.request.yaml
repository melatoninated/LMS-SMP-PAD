$kind: http-request
description: Wajib untuk akun dengan `must_change_password` bernilai true. Password minimum 8 karakter dan konfirmasi harus sama.
url: "{{baseUrl}}/api/auth/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "current_password": "{{password}}",
      "password": "NewPassword!2026",
      "password_confirmation": "NewPassword!2026"
    }
order: 3000
